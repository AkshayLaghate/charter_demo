<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="pdf_charter">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>pdf_charter</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Customize browser-native spellcheck highlighting */
    ::spelling-error {
      text-decoration: underline wavy #FF0000 !important; /* Pure red for maximum visibility */
      text-decoration-color: #FF0000 !important;
      text-decoration-style: wavy !important;
      text-decoration-thickness: 3px !important;
      background-color: rgba(255, 0, 0, 0.1) !important; /* Subtle red bg in case underline fails */
    }
  </style>
  <script>
    // Enable browser-native spellcheck for Flutter Web
    function enableSpellCheck(el) {
      if (!el) return;
      if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.contentEditable === 'true') {
        if (el.getAttribute('spellcheck') !== 'true') {
          el.setAttribute('spellcheck', 'true');
        }
      }
    }

    // Monitor for focus and DOM changes
    document.addEventListener('focus', (e) => enableSpellCheck(e.target), true);
    document.addEventListener('focusin', (e) => enableSpellCheck(e.target), true);

    // Periodic check for dynamically created inputs (common in Flutter Web)
    setInterval(() => {
      const inputs = document.querySelectorAll('input, textarea, [contenteditable="true"]');
      inputs.forEach(enableSpellCheck);
    }, 1000);
  </script>
</head>

<body>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
